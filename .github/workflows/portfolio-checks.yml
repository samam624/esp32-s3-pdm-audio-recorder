name: Portfolio checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m py_compile mictest.py scripts/verify_wav_fixtures.py
      - name: Verify checked-in WAV evidence
        run: python scripts/verify_wav_fixtures.py
